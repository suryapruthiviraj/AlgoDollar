[build-system]
requires = ["setuptools>=68", "wheel"]
# `setuptools.build_meta` is the real PEP 517 backend. The previous value,
# "setuptools.backends.legacy:build", does not exist — pip raised
# `BackendUnavailable: Cannot import 'setuptools.backends.legacy'`, so every
# Backend CI run died at the install step and no backend test had ever
# actually executed in CI.
build-backend = "setuptools.build_meta"

[project]
name = "algodollar"
version = "0.1.0"
description = "AlgoDollar quantitative trading platform backend"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AlgoDollar" }]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyJWT>=2.10",
    "bcrypt>=4.1",
    "redis>=5.0",   # redis.asyncio; aioredis is unmaintained and cannot import on py3.11+
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.6",
    "kiteconnect>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    # Imported by app/broker/zerodha.py for IST handling but never declared —
    # CI failed with ModuleNotFoundError while local passed.
    "pytz>=2024.1",
    "python-multipart>=0.0.31",
    "aiofiles>=23.2",
    "celery[redis]>=5.3",
    "websockets>=12.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    # Async SQLite driver. `tests/test_reconciliation_recovery.py` exercises
    # SqlAlchemyLocalStateStore against real ORM tables, which needs an async
    # driver. It was missing here, so those 7 tests ERRORed in CI while
    # passing locally on a machine where it happened to be installed — the
    # exact shape of a green-locally / red-in-CI gap.
    "aiosqlite>=0.19",
    # Bandit runs in the security workflow; pinning it here keeps the local
    # and CI versions aligned so findings do not differ between them.
    "bandit>=1.7",
    "ruff>=0.5",
    "mypy>=1.8",
    # Parquet engine used by the data cache and by the safe (non-pickle)
    # DataFrame serialization in app/data/historical.py.
    "pyarrow>=15.0",
]

# Package discovery must be EXPLICIT. setuptools' flat-layout autodiscovery
# treats every top-level directory as a candidate package, so adding
# `research_data/` (acquired market data and its manifests) made the install
# fail outright:
#
#   error: Multiple top-level packages discovered in a flat-layout:
#          ['app', 'research_data']
#
# That broke `pip install -e .`, which broke Backend CI and Safety Gates
# together. `app` is the only importable package here; `scripts/` and
# `research_data/` are run and read from the repo, never imported.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
# Moved under [lint] — ruff deprecated the top-level form and was emitting a
# warning on every CI run.
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    # N803/N806 demand lowercase argument and variable names. Numerical code
    # here follows mathematical convention instead: `X` is a design matrix, `y`
    # a target vector, `Sigma` a covariance matrix. Renaming them to `x_train`
    # and `sigma` would make the code HARDER to check against the formulas it
    # implements, which matters more than the naming rule.
    #
    # This is a style exemption, not a security one: no Bandit, secret-scanner
    # or dependency-audit finding is suppressed anywhere in this file.
    "N803",
    "N806",
    # N818 wants every exception class to end in "Error". These are deliberate
    # names that read as conditions at the call site — `except LiveTradingBlocked`
    # and `except IllegalStateTransition` say what happened more clearly than an
    # -Error suffix would. Renaming them is a breaking API change across the
    # execution and governance layers for no safety benefit.
    "N818",
]

# Ruff now lints tests/ as well as app/ (CI previously checked only app/, so
# 158 findings in tests/ were never surfaced — including two tests that
# computed a result and never asserted on it).
#
# N802 wants lowercase function names. Regression tests here are deliberately
# named `test_BUG_<the-defect-it-pins>`, so the uppercase marker is the point:
# it says at a glance which tests exist because something was once broken.
# Renaming them would lose that. Style only — no security or correctness rule
# is relaxed for tests, and every other rule applies to them exactly as to app/.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
