# AlgoDollar database migrations — access point for Alembic.
#
#   alembic -c backend/alembic.ini upgrade head       # from the repo root
#   alembic upgrade head                              # inside the backend image
#   docker compose exec backend alembic upgrade head  # via make migrate
#
# The App never runs migrations itself. `migrations/env.py` reads the real
# DATABASE_URL from app.core.config; the placeholder below is only for
# `alembic -c ...` invocations that happen to reference it before env.py
# substitutes the setting. Leave it empty.
#
# Scripts live in `migrations/versions/`; every revision is created with
# `--autogenerate` and then REVIEWED like a diff before it is run anywhere.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S