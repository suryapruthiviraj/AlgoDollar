name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

# Least privilege: this workflow only reads the source and produces artifacts.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-node's npm cache is keyed on a lockfile, and pointing
      # `cache-dependency-path` at a file that does not exist is a hard error
      # ("Some specified paths were not resolved, unable to cache
      # dependencies"), not a warning. frontend/package-lock.json IS committed
      # now, so the `true` branch is the one that runs; the detection stays so
      # that deleting the lockfile degrades to a warning instead of breaking
      # the job outright.
      - name: Detect npm lockfile
        id: lockfile
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "frontend/package-lock.json found: using npm ci with dependency caching."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning file=frontend/package.json::frontend/package-lock.json is not committed. npm dependency caching is disabled and versions are re-resolved on every run, so two builds of the same commit can differ. Commit a lockfile to make this reproducible and cacheable."
          fi

      - name: Set up Node.js 22 (with npm cache)
        if: steps.lockfile.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the node:22-bookworm-slim base used by frontend/Dockerfile,
          # so CI and the shipped image compile against the same runtime.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Node.js 22 (no lockfile, caching unavailable)
        if: steps.lockfile.outputs.present != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            # --legacy-peer-deps is a leftover from next@15.0.0, whose
            # peerDependencies.react excluded the stable react@19 this project
            # uses, making a plain `npm install` die with ERESOLVE. next@16
            # accepts react@19 properly, so this is belt-and-braces for the
            # no-lockfile path only — `npm ci` above uses no such flag.
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      # `npm run lint` is `eslint .` — Next 16 REMOVED the `next lint` command,
      # and under it `next lint` is parsed as `next <directory>` and dies with
      # "Invalid project directory provided, no such directory: .../lint".
      #
      # ESLint exits non-zero with a usage error when it finds no config, which
      # reads as a lint failure rather than a missing-setup problem. This
      # preflight names the actual cause instead. CI deliberately does NOT
      # generate a config on the fly: linting against rules nobody reviewed and
      # nobody can see in the diff proves nothing.
      #
      # Lint, type-check and build are independent given a successful install,
      # so each runs on its own rather than stopping the job at the first
      # failure. One push then reports everything that is wrong.
      - name: Verify an ESLint configuration is committed
        id: eslint_config
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: frontend
        run: |
          config=""
          for f in .eslintrc .eslintrc.js .eslintrc.cjs .eslintrc.mjs \
                   .eslintrc.json .eslintrc.yml .eslintrc.yaml \
                   eslint.config.js eslint.config.mjs eslint.config.cjs \
                   eslint.config.ts; do
            if [ -f "$f" ]; then config="$f"; break; fi
          done
          if [ -z "$config" ]; then
            echo "::error file=frontend/package.json::frontend/ has no ESLint configuration, so \`npm run lint\` (eslint .) cannot run. Commit frontend/eslint.config.mjs spreading eslint-config-next/core-web-vitals and eslint-config-next/typescript — eslint-config-next is already a devDependency."
            exit 1
          fi
          echo "Using ESLint configuration: frontend/$config"

      # Gated on the preflight, not just the install, so a missing config is
      # reported as a missing config rather than as a lint failure.
      - name: Run ESLint
        if: ${{ !cancelled() && steps.eslint_config.outcome == 'success' }}
        working-directory: frontend
        run: npm run lint

      - name: Type-check with tsc
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: frontend
        run: npx --no-install tsc --noEmit

      - name: Build Next.js application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: frontend
        env:
          # Inlined into the client bundle at build time, so it must be a URL a
          # browser can resolve. Never a credential — this value ships publicly.
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Only on success: .next/ does not exist if the build failed, and a
        # second "no files were found" error there would just bury the real one.
        if: success()
        with:
          name: nextjs-build
          # .next/cache is a local build cache, not part of the output, and is
          # by far the largest thing in .next/.
          # `frontend/.next/**`, not `frontend/.next/`. upload-artifact matches
          # FILES via glob; a bare directory path combined with a `!` exclusion
          # resolves to an empty set, so this failed with "No files were found"
          # even though the build had succeeded and emitted all 19 routes.
          path: |
            frontend/.next/**
            !frontend/.next/cache/**
          # `.next` is a DOT-directory, and upload-artifact v4+ excludes hidden
          # files by default. Without this the step reported "No files were
          # found" even though the build had succeeded and emitted all 19
          # routes — the files were there, just filtered out.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
