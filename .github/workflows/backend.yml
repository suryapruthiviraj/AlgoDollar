name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# Least privilege. Nothing in this workflow writes to the repository, opens
# issues, or publishes packages, so the token gets read-only access to code.
permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR. A stale run of an older
# commit is never the answer to "is this commit good?".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: algodollar
          POSTGRES_PASSWORD: algodollar_password
          POSTGRES_DB: algodollar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algodollar -d algodollar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://algodollar:algodollar_password@localhost:5432/algodollar_test
      REDIS_URL: redis://localhost:6379/0
      # Must be one of app/core/config.py's Literal values — "test" is not one
      # of them, and importing app.core.config with APP_ENV=test raised
      # ValidationError, which collected as an error in two test modules.
      # "development" is the non-production value; CI must never set "live",
      # and "paper"/"staging" would claim a trading posture CI does not have.
      APP_ENV: development
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      # This platform can place real orders. CI must never run in any mode
      # that could reach a live broker.
      TRADING_MODE: paper
      LOG_LEVEL: WARNING

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to the repo, so do not leave a usable
          # credential in .git/config for later steps to pick up.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # setup-python's own pip cache replaces the hand-rolled actions/cache
          # step. Both paths below exist in the repo; pointing the cache at a
          # file that does not exist is a hard error, not a warning.
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.txt

      - name: Install dependencies
        id: install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # No `|| true` and no fallback: if the project metadata is broken the
          # install must fail loudly here rather than limping on with a partial
          # environment and failing later in a confusing place.
          pip install -e ".[test]"

      # Lint, types and tests are independent of each other. Running each of
      # them whenever the install succeeded — rather than stopping at the first
      # failure — means one push reports everything that is wrong instead of
      # one thing per push. Every step still fails the job on its own.
      - name: Run ruff linter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        # `app tests` — not just `app`. Linting only the application let 158
        # findings accumulate in tests/, including two tests that computed a
        # result and asserted nothing about it. Test code gates releases; it is
        # held to the same bar.
        run: ruff check app tests

      - name: Run mypy type checker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: mypy app

      - name: Run pytest with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            -q

      # Codecov needs a token this repository does not currently have, and on
      # a pull request from a fork secrets are unavailable by design. Rather
      # than letting the upload fail (or hiding it behind fail_ci_if_error),
      # decide up front whether it can run. Coverage is still computed above
      # and attached to the run as an artifact either way, so nothing is lost.
      - name: Determine whether Codecov upload is configured
        id: codecov_config
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CODECOV_TOKEN is not configured for this repository, so the Codecov upload is not attempted. backend/coverage.xml is attached to this run as an artifact instead."
          fi

      - name: Upload coverage to Codecov
        if: steps.codecov_config.outputs.enabled == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          # If the upload is configured it is expected to work; a broken
          # upload should be visible, not swallowed.
          fail_ci_if_error: true

      - name: Upload test results and coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
          retention-days: 7
          if-no-files-found: warn
