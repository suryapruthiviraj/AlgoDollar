name: Docker Build

# Also runs on pull requests: a change that breaks the image build should be
# visible before it reaches main, not after. Nothing here needs secrets, and
# `push: false` means no registry credentials are involved, so this is safe to
# run against fork PRs under the read-only token below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. The images are built and thrown away — they are never
# pushed — so no `packages: write`, no registry login, no secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # buildx's own error for a missing Dockerfile is "failed to read
      # dockerfile: open Dockerfile: no such file or directory", which names
      # neither the path it looked in nor the context. Say it plainly instead.
      - name: Verify backend Dockerfile exists
        run: |
          if [ ! -f backend/Dockerfile ]; then
            echo "::error file=backend/Dockerfile::backend/Dockerfile is missing. This job builds with context ./backend and file ./backend/Dockerfile."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build backend Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Build-only verification: never publish from CI, and never require
          # registry credentials to run this workflow.
          push: false
          load: false
          # backend/Dockerfile documents linux/amd64 as its target platform.
          platforms: linux/amd64
          tags: |
            algodollar/backend:${{ github.sha }}
            algodollar/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify frontend Dockerfile exists
        run: |
          if [ ! -f frontend/Dockerfile ]; then
            echo "::error file=frontend/Dockerfile::frontend/Dockerfile is missing. This job builds with context ./frontend and file ./frontend/Dockerfile."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build frontend Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          platforms: linux/amd64
          tags: |
            algodollar/frontend:${{ github.sha }}
            algodollar/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          # NEXT_PUBLIC_* values are inlined into the client bundle at build
          # time and ship to every browser. Only ever pass service URLs here,
          # never a credential — build args are readable in `docker history`.
          build-args: |
            BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=http://localhost:8000
